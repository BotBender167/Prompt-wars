name: Quality

on:
  push:
  pull_request:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cohort
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cohort/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage

  deployed-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cohort
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cohort/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          BASE_URL: https://prompt-wars-blue-mu.vercel.app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: cohort/playwright-report/
          retention-days: 14
